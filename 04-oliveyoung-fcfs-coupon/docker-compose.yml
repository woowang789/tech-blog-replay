services:
  redis:
    image: redis:8.10.2
    # 발급 수량을 관리하는 저장소. 실험마다 지웠다가 다시 쓰는 값뿐이라 RDB 스냅샷을 끈다
    command: ["redis-server", "--save", ""]

  rabbitmq:
    # 원문의 Message Queue. 올리브영 쿠폰 시스템은 RabbitMQ를 쓴다(원문이 링크한 "쿠폰 발급 RabbitMQ 도입기")
    image: rabbitmq:4-management
    environment:
      # 기본 사용자 guest는 localhost에서만 접속할 수 있어서, 다른 컨테이너(app)가 쓸 사용자를 만든다
      RABBITMQ_DEFAULT_USER: replay
      RABBITMQ_DEFAULT_PASS: replay
    ports:
      - "15672:15672" # 관리 화면 http://localhost:15672 (replay / replay). 큐에 쌓인 메시지와 소비자 수를 볼 수 있다
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 3s
      timeout: 3s
      retries: 40

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: replay
      MYSQL_USER: replay
      MYSQL_PASSWORD: replay
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      # 발급 워커가 동시에 처리하는 메시지 수. 아무것도 안 주면 8이다(1단계에서 4 → 8. 이 노트북에서 4개는 초당 500건도 못 따라간다)
      REPLAY_WORKERCONCURRENCY: ${WORKER_CONCURRENCY:-8}
      # 3단계 스위치: 수량을 다루는 방법. original(원문 기존), precharge(시도 1), lua(시도 2), double-counter(시도 3 + 1, 원문의 최종 선택)
      REPLAY_ISSUEMODE: ${ISSUE_MODE:-original}
      # 4단계 스위치: 실패 주입(none, db-error, crash-before-ack, front-crash)과 몇 명마다 걸지, DB 실패 처리(retry, rollback),
      # 멱등 워커(유니크 제약), 보상(countReq 되돌림). 아무것도 안 주면 0~3단계와 같다
      REPLAY_FAULT: ${FAULT:-none}
      REPLAY_FAULTEVERY: ${FAULT_EVERY:-100}
      REPLAY_ONDBFAILURE: ${ON_DB_FAILURE:-retry}
      REPLAY_IDEMPOTENT: ${IDEMPOTENT:-false}
      REPLAY_COMPENSATE: ${COMPENSATE:-false}
    ports:
      - "8080:8080" # API (쿠폰 발급 요청, 실험용 초기화·집계)
      - "8081:8081" # actuator (지표)
    stop_grace_period: 2s
