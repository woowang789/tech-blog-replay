spring:
  application:
    name: fcfs-coupon
  datasource:
    # sslMode=DISABLED: 기본값(PREFERRED)이면 MySQL 8.4와 TLS로 맺는다. 워커가 발급마다 DB에 쓰는 비용에서 TLS 암호화 CPU를 뺀다
    url: jdbc:mysql://${DB_HOST:localhost}:3306/replay?sslMode=DISABLED
    username: replay
    password: replay
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create
  data:
    redis:
      # 발급 수량 관리 저장소. 원문처럼 DB 대신 Redis에서 수량을 읽는다
      host: ${REDIS_HOST:localhost}
      port: 6379
  rabbitmq:
    # 원문의 Message Queue. 온라인몰(앞단)이 발급 요청을 발행하고 발급 워커가 소비한다
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: replay
    password: replay
    cache:
      channel:
        # 발행에 쓰는 채널을 Tomcat 요청 스레드 수(200)만큼 캐시한다. 기본 25개면 동시 발행이 그보다 많을 때
        # 요청마다 채널을 열고 닫아(브로커 왕복 2번, 캐시 잠금 안에서) 응답이 급격히 느려진다
        size: 200

management:
  server:
    # API(8080)와 포트·스레드 풀을 나눠서 부하 중에도 지표를 볼 수 있다
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,metrics

replay:
  # 발급 요청 메시지가 오가는 큐 이름
  queue-name: coupon-issue
  # 발급 워커가 동시에 처리하는 메시지 수(리스너의 소비자 스레드 수). 운영에서는 워커가 여럿이라 1보다 크다
  worker-concurrency: 8
  # 앞단과 워커가 수량을 다루는 방법(3단계). original: 원문의 기존 로직(앞단 GET, 워커 GET+INCR),
  # precharge: 시도 1 선차감(앞단 GET+INCR), lua: 시도 2 Lua 스크립트(앞단 EVALSHA),
  # double-counter: 시도 3 이중 카운터 + 선차감(앞단 INCR countReq → INCR count. 원문의 최종 선택)
  issue-mode: original
  # 4단계 스위치. 모두 기본값이면 0~3단계와 같다
  # fault: 성공 응답 뒤의 실패를 일으킨다. none, db-error(워커 DB 저장 실패), crash-before-ack(저장 뒤 ack 전 종료), front-crash(countReq 뒤 count 전 종료)
  fault: none
  # fault-every: 사용자 번호가 이 수의 배수인 요청에만 실패를 건다
  fault-every: 100
  # on-db-failure: 워커의 DB 저장이 실패했을 때. rollback(원문: 수량을 되돌리고 포기) 또는 retry(예외를 던져 메시지를 다시 받는다)
  on-db-failure: retry
  # idempotent: true면 발급 내역에 (coupon_id, user_id) 유니크 제약을 걸어 같은 사용자의 두 번째 저장을 막는다
  idempotent: false
  # compensate: true면 이중 카운터에서 countReq를 올린 뒤 count를 올리기 전에 예외가 나면 countReq를 되돌린다
  compensate: false
