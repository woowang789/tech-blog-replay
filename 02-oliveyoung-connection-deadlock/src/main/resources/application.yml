spring:
  application:
    name: connection-deadlock
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/replay
    username: replay
    password: replay
    hikari:
      # Spring Boot 기본값을 그대로 적어 둔다
      maximum-pool-size: 10
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create
  cloud:
    aws:
      # 로컬 SQS(ElasticMQ)는 인증을 보지 않지만 AWS SDK가 값을 요구해서 아무 값이나 넣는다
      region:
        static: ap-northeast-2
      credentials:
        access-key: local
        secret-key: local
      sqs:
        endpoint: http://${SQS_HOST:localhost}:9324
        listener:
          # Spring Cloud AWS 기본값을 그대로 적어 둔다: 큐 하나에서 동시에 처리하는 메시지 수, 한 번에 가져오는 메시지 수
          max-concurrent-messages: 10
          max-messages-per-poll: 10

management:
  server:
    # API(8080)와 포트·스레드 풀을 나눠서 장애 중에도 지표와 스레드 덤프를 볼 수 있다
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,metrics,threaddump

replay:
  queue-name: notice-queue
  # 가짜 Messaging API가 응답하는 데 걸리는 시간
  messaging-api-latency: 200ms
  # 이력 저장에 REQUIRES_NEW를 쓰는지. false면 원문의 해결 ①(REQUIRES_NEW 제거)이다
  history-requires-new: true
  # 4단계: 알림 구조. article은 올리브영 구조(1~3단계 코드), ledger는 권하는 구조(알림 원장 + outbox + 멱등 소비자)다
  notice-design: article
  notification-queue-name: notification-queue
  # 4단계: 실패 주입 지점. none, publish, after-send, after-record (experiment/Fault 참고)
  fault: none
  # 4단계: 가짜 Messaging API가 멱등 키를 지원하는지
  provider-idempotency: true
  # 4단계: outbox 릴레이가 발행할 요청을 찾는 간격(ms)
  relay-interval: 200
  # 4단계: 선점 유효 시간. SENDING인 채 이보다 오래되면 다시 선점할 수 있다.
  # 가시성 타임아웃(30초)보다 짧아야, 다시 들어온 메시지가 선점을 넘겨받는다
  claim-lease: 20s
