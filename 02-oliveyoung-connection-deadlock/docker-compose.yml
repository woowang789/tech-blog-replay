services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: replay
      MYSQL_USER: replay
      MYSQL_PASSWORD: replay
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 2s
      timeout: 3s
      retries: 30

  sqs:
    # 로컬 SQS: SQS API를 그대로 흉내 내는 ElasticMQ. 앱은 compose 네트워크 안에서 sqs:9324로,
    # 스크립트(watch.sh, queue.sh)는 내 컴퓨터에서 localhost:9324로 SQS API를 부른다
    image: softwaremill/elasticmq-native:1.7.1
    ports:
      - "9324:9324"

  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
      sqs:
        condition: service_started
    environment:
      DB_HOST: mysql
      SQS_HOST: sqs
    ports:
      - "8080:8080" # API (실험용 메시지 발행)
      - "8081:8081" # actuator (지표, 스레드 덤프)
    stop_grace_period: 2s
