services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: replay
      MYSQL_USER: replay
      MYSQL_PASSWORD: replay
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 2s
      timeout: 3s
      retries: 30

  sqs:
    # 로컬 SQS: SQS API를 그대로 흉내 내는 ElasticMQ. 앱은 compose 네트워크 안에서 sqs:9324로,
    # 스크립트(watch.sh, queue.sh)는 내 컴퓨터에서 localhost:9324로 SQS API를 부른다
    image: softwaremill/elasticmq-native:1.7.1
    ports:
      - "9324:9324"

  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
      sqs:
        condition: service_started
    environment:
      DB_HOST: mysql
      SQS_HOST: sqs
      # 2단계 스위치: 원문 공식(Tn × (Cm − 1) + 1)의 경계를 확인할 때 쓴다. 아무것도 안 주면 기본값(10, 10)이다
      SPRING_DATASOURCE_HIKARI_MAXIMUMPOOLSIZE: ${HIKARI_MAX_POOL_SIZE:-10}
      SPRING_CLOUD_AWS_SQS_LISTENER_MAXCONCURRENTMESSAGES: ${MAX_CONCURRENT_MESSAGES:-10}
      # 한 번에 가져오는 수는 동시 처리 수보다 클 수 없어서(Spring Cloud AWS가 검사한다) 같은 값으로 맞춘다
      SPRING_CLOUD_AWS_SQS_LISTENER_MAXMESSAGESPERPOLL: ${MAX_CONCURRENT_MESSAGES:-10}
      # 3단계 스위치: false면 원문의 해결 ①(이력 저장의 REQUIRES_NEW 제거). 아무것도 안 주면 장애 그대로(true)다
      REPLAY_HISTORYREQUIRESNEW: ${HISTORY_REQUIRES_NEW:-true}
      # 4단계 스위치: 알림 구조(article, ledger), 실패 주입 지점(none, publish, after-send, after-record),
      # 가짜 Messaging API의 멱등 키 지원. 아무것도 안 주면 1~3단계와 같다
      REPLAY_NOTICEDESIGN: ${NOTICE_DESIGN:-article}
      REPLAY_FAULT: ${FAULT:-none}
      REPLAY_PROVIDERIDEMPOTENCY: ${PROVIDER_IDEMPOTENCY:-true}
    ports:
      - "8080:8080" # API (실험용 메시지 발행)
      - "8081:8081" # actuator (지표, 스레드 덤프)
    stop_grace_period: 2s
