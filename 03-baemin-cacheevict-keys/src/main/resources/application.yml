spring:
  application:
    name: cache-evict
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  cache:
    # Redis 캐시 자동 설정을 그대로 쓴다. 키는 "캐시 이름::키"(예: products::1), 값은 JDK 직렬화다
    type: redis

management:
  server:
    # API(8080)와 포트·스레드 풀을 나눠서 장애 중에도 지표를 볼 수 있다
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,metrics

replay:
  # 캐시에 없을 때 상품을 읽어 오는 데 걸리는 시간(가짜 DB 조회)
  product-load-latency: 10ms
  # 캐시 쓰기를 원문(Spring Data Redis 3.3.7)처럼 동기로 하는지. false면 4.x 기본값(Lettuce에서 비동기)이다
  cache-immediate-writes: false
